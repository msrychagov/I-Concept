x-database-environment: &database-environment
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: app
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  DB_NAME: app_db
  DB_SSLMODE: disable

x-application: &application
  image: i-concept:${IMAGE_TAG:-local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  app:
    <<: *application
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    # The key of the language model (GIGACHAT_AUTH_KEY, GIGACHAT_MODEL) lives
    # outside the repository; without the file the model is simply off.
    env_file:
      - path: ../.secrets/llm.env
        required: false
    environment:
      <<: *database-environment
      VUC_ADMIN_USER: ${VUC_ADMIN_USER:-admin}
      VUC_ADMIN_PASSWORD: ${VUC_ADMIN_PASSWORD:-}
      GIGACHAT_CA_FILE: /app/certs/mincifry.crt
      # Set LOCAL_LLM_MODEL=qwen3:1.7b in .env to enable local report generation.
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_URL: http://ollama:11434
    volumes:
      - ../.secrets/russian_trusted_root_ca_pem.crt:/app/certs/mincifry.crt:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    <<: *application
    entrypoint: ["migrate"]
    command: []
    restart: "no"
    environment: *database-environment
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    <<: *application
    profiles: ["tools"]
    entrypoint: ["seed"]
    command: []
    environment: *database-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  importdata:
    <<: *application
    profiles: ["tools"]
    entrypoint: ["importdata"]
    command: ["-file", "/import/vuc.json"]
    environment: *database-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Optional local language model. Pull weights once after starting:
  # docker compose --profile ai up -d ollama
  # docker compose exec ollama ollama pull qwen3:1.7b
  ollama:
    # Pinned: ollama/ollama:latest (0.40.x) has no llama-server for CPU on arm64.
    image: ollama/ollama:0.12.6
    profiles: ["ai"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: app_db
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  ollama_models:
