<div class="research-layout">
    <aside class="research-nav" id="main-sidebar" aria-label="Основная навигация">
        <a class="brand" href="/" aria-label="На главную"><img class="brand-mark" src="/assets/images/reference/crest.png" alt="Эмблема ВУЦ" width="99" height="93"></a>
        <nav id="nav">
            <button data-tab="overview" class="active"><img class="ui-icon" src="/assets/images/icons/home.svg" alt="" aria-hidden="true" width="20" height="20"><span>Главная</span></button>
            <button data-tab="autobiography"><img class="ui-icon" src="/assets/images/icons/file.svg" alt="" aria-hidden="true" width="20" height="20"><span>Автобиография</span></button>
            <button data-tab="profiles"><img class="ui-icon" src="/assets/images/icons/target.svg" alt="" aria-hidden="true" width="20" height="20"><span>Диагностическое тестирование</span></button>

            <button data-tab="model"><img class="ui-icon" src="/assets/images/icons/book.svg" alt="" aria-hidden="true" width="20" height="20"><span>Модель и методика</span></button>
            <button data-tab="settings"><img class="ui-icon" src="/assets/images/icons/settings.svg" alt="" aria-hidden="true" width="20" height="20"><span>Настройки</span></button>
        </nav>
        <div class="nav-motto"><div class="building-picture" aria-hidden="true"></div><span>«Знание<br>Ответственность<br>Служение»</span><i aria-hidden="true"></i></div>
    </aside>
    <div class="research-workspace">
        <header class="app-topbar">
            <button class="menu-toggle secondary" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="main-sidebar"><img class="ui-icon" src="/assets/images/icons/menu.svg" alt="" aria-hidden="true" width="20" height="20"></button><div class="topbar-title"><b>Электронная диагностическая система</b></div>
            <div class="teacher-user-menu">
                <button class="user-state teacher-user-trigger" id="teacher-user-trigger" type="button" aria-expanded="false" aria-haspopup="menu" aria-controls="teacher-user-dropdown" aria-label="Меню преподавателя">
                    <span class="user-avatar" id="teacher-avatar">П</span>
                    <span class="teacher-user-details"><span id="teacher-name">Преподаватель</span><small>Преподаватель</small></span>
                    <img class="ui-icon teacher-user-chevron" src="/assets/images/icons/chevron-down.svg" alt="" aria-hidden="true" width="16" height="16">
                </button>
                <div class="teacher-user-dropdown" id="teacher-user-dropdown" role="menu" aria-label="Меню преподавателя" aria-hidden="true" inert>
                    <button id="teacher-logout" type="button" role="menuitem"><img class="ui-icon" src="/assets/images/icons/logout.svg" alt="" aria-hidden="true" width="20" height="20"><span>Выйти</span></button>
                </div>
            </div>
        </header>
        <main class="research-main">
            <div id="messages"></div>
            <div id="view"><h1>Загрузка…</h1></div>
        </main>
        <footer class="site-footer">Электронная диагностическая система воспитания студента ВУЦ <span>© 2026</span></footer>
