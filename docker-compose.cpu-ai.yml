# CPU-only Ollama settings for I-Concept; extend, do not replace, docker-compose.yaml.
services:
  ollama:
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_NO_CLOUD: "1"
    # Do not set a memory/CPU limit without checking the host first.
    # App explicitly sends num_ctx=8192 in Go client.
